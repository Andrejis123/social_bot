slug: transit
name: "Transit Operator Benchmarking (European peer dataset)"

# One dataset for the whole vertical: scrape these once, sell reports off it to
# DPB, DPMK Kosice, DPMZ Zilina, DPP Praha and the PL/HU operators. Marginal
# cost per extra client is close to zero, which is the reason this vertical is
# worth more than the single DPB deal.
#
# All 64 handles resolved through HikerAPI on 07/08-08-2026: real pk, public,
# 500+ followers, identity confirmed in full_name/bio, and a post inside the
# last 180 days. Full evidence, IG pks, rejected handles and the story snapshot
# live in research/marketing/transit_peer_accounts.md. Verify a handle there
# before adding or removing one here.
#
# Andy 08-08-2026: scrape far and wide (HikerAPI Business tier cut per-request
# cost, Supabase Pro removed the storage squeeze). NO backfill - posts and
# stories both start from the arm date, at matching cadence. Stories are the
# differentiator and cannot be backfilled at all.
#
# CONSTRAINT worth knowing: `accounts` is UNIQUE (platform, handle) with a NOT
# NULL client_id, so an account belongs to exactly one client. Peers therefore
# cannot be shared across a second client config, and a per-buyer deck needs
# report-side account selection rather than a second client. Tracked separately.
#
# Rejected as dormant (do not re-add): @pmdp_plzen 01-2024, @zet_zagreb 04-2023,
# @volanbusz 01-2025, @tussamsevilla 03-2018. Wrong-entity trap: @gvbamsterdam
# (3.6k followers, dead since 2019) is NOT GVB - the live account is @gvb_online.
# Fakes and squatters plus private accounts are listed in the research file.

